name: Genco Backend Staging CICD

on:
  push:
    branches: ['be-stg']


jobs:
  deploy:
    runs-on: genco-runner

    steps:

    - name: Checkout source repository
      uses: actions/checkout@v4

    - name: Create .env File
      run: |
        touch .env
        echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
        echo "PORT=${{ secrets.PORT }}" >> .env
        echo "WEB_APP_URL=${{ secrets.WEB_APP_URL }}" >> .env
        echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env
        echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env
        echo "TWILIO_FROM_NUMBER=${{ secrets.TWILIO_FROM_NUMBER }}" >> .env
        echo "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" >> .env
        echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env
        echo "TYPE=${{ secrets.TYPE }}" >> .env
        echo "PROJECT_ID=${{ secrets.PROJECT_ID }}" >> .env
        echo "PRIVATE_KEY_ID=${{ secrets.PRIVATE_KEY_ID }}" >> .env
        echo "PRIVATE_KEY=${{ secrets.PRIVATE_KEY }}" >> .env
        echo "CLIENT_EMAIL=${{ secrets.CLIENT_EMAIL }}" >> .env
        echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> .env
        echo "AUTH_URI=${{ secrets.AUTH_URI }}" >> .env
        echo "TOKEN_URI=${{ secrets.TOKEN_URI }}" >> .env
        echo "AUTH_PROVIDER_X509_CERT_URL=${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}" >> .env
        echo "CLIENT_X509_CERT_URL=${{ secrets.CLIENT_X509_CERT_URL }}" >> .env
        echo "MQTT_HOST=${{ secrets.MQTT_HOST }}" >> .env
        echo "MQTT_PORT=${{ secrets.MQTT_PORT }}" >> .env
        echo "MQTT_USERNAME=${{ secrets.MQTT_USERNAME }}" >> .env
        echo "MQTT_PASSWORD=${{ secrets.MQTT_PASSWORD }}" >> .env
        echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
        echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
        echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
        echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env

    - name: Deploy Docker Container     
      run: |
        docker-compose -f docker-compose.stg.yml build
        docker-compose -f docker-compose.stg.yml -p "stg_genco_stack" down
        docker-compose -f docker-compose.stg.yml -p "stg_genco_stack" up -d