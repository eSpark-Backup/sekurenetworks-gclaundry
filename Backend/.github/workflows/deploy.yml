name: Deployment on Dev Environment

on:
  push:
    branches: ['develop']
jobs:
  build-deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [18.x]

    env:
      PORT: 8000

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install Dependencies
        run: yarn install

      # - name: Run migration for database
      #   run: yarn migration:run

      - name: Restart NestJS application
        run: yarn deploy:dev-env

      - name: Save pm2
        run: pm2 save
