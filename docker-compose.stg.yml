services:
  genco_api:
    container_name: stg_genco_api
    image: "genco-backend-stg:latest"
    environment:
      - NODE_ENV
      - PORT
      - WEB_APP_URL
      - TWILIO_ACCOUNT_SID
      - TWILIO_AUTH_TOKEN
      - TWILIO_FROM_NUMBER
      - SENDGRID_API_KEY
      - EMAIL_FROM
      - TYPE
      - PROJECT_ID
      - PRIVATE_KEY_ID
      - PRIVATE_KEY
      - CLIENT_EMAIL
      - CLIENT_ID
      - AUTH_URI
      - TOKEN_URI
      - AUTH_PROVIDER_X509_CERT_URL
      - CLIENT_X509_CERT_URL
      - MQTT_HOST
      - MQTT_PORT
      - MQTT_USERNAME
      - MQTT_PASSWORD
      - DATABASE_URL

    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3001:3000
  
    depends_on:
      genco_db:
        condition: service_healthy

  genco_db:
    container_name: stg_genco_db
    image: postgres:latest
    ports:
      - 5431:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - stg_genco_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
      retries: 10

volumes:
  stg_genco_database: